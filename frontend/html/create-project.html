      </div>

      <h1>Загрузи референсы<br>и начни <span>создавать</span></h1>

      <p class="description">
        Добавь несколько изображений, и Designity найдет связи,<br class="desktop-break">
        проанализирует стили и создаст дизайн
      </p>
